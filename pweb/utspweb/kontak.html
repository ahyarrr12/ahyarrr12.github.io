<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontak — Ayay Consultant</title>
  <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(to right, #1e293b, #0e7490);
      color: white;
    }
  </style>
</head>

<body class="py-5">

  <section class="container py-4">
    <div class="row g-5 align-items-center">
      <div class="col-md-6">
        <h1 class="fw-bold display-6">Kontak Kami</h1>
        <p class="mt-3 text-white-50">Hubungi kami melalui formulir atau informasi kontak berikut.</p>
        <ul class="mt-4 small text-white-50">
          <li>Email: <a href="mailto:info@perusahaan.id" class="text-white text-decoration-underline">ayayconsultant@bandung.id</a></li>
          <li>Telepon: +62 8562460171</li>
          <li>Alamat: Jalan Riung Bandung No 133, Bandung</li>
        </ul>
      </div>
      <div class="col-md-6">
        <form id="contactForm" class="bg-white text-dark p-4 rounded shadow-sm">
          <div class="mb-3">
            <label class="form-label">Nama</label>
            <input required name="name" type="text" class="form-control" placeholder="Nama lengkap">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input required name="email" type="email" class="form-control" placeholder="email@contoh.id">
          </div>
          <div class="mb-3">
            <label class="form-label">Pesan</label>
            <textarea required name="message" rows="4" class="form-control" placeholder="Tulis pesan..."></textarea>
          </div>
          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-info text-white px-4">Kirim Pesan</button>
          </div>
        </form>
      </div>

    </div>
  </section>
  <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
