<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login</title>
<link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow" style="width: 350px;">
<h4 class="text-center mb-3">Masuk</h4>
<form onsubmit="return validateLogin()">
<input id="email" type="email" placeholder="Email" class="form-control mb-3" required>
<input id="password" type="password" placeholder="Password" class="form-control mb-3" required>
<button class="btn btn-info w-100 text-white">Masuk</button>
<p class="mt-3 text-center">Belum punya akun? <a href="register.html">Daftar</a></p>
</form>
</div>
<script>
function validateLogin() {
let email = document.getElementById("email").value;
let password = document.getElementById("password").value;
const validEmail = "admin@gmail.com";
const validPassword = "admin";

  if (email === validEmail && password === validPassword) {
    alert("Login berhasil!");
    window.location.href = "index.html"; 
    return false; 
} else {
    alert("Email atau password salah!");
    return false; 
}
}
</script>

</body>
</html>
